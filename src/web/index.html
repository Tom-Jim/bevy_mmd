<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bevy3Danimation</title>
  <base data-trunk-public-url />
  <!-- Control panels: the React bundle built by `bun run build` in src/ui. -->
  <link data-trunk rel="copy-dir" href="../ui/dist/assets" data-target-path="ui" />
  <link rel="stylesheet" href="ui/ui.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #17191f; }
    #bevy { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); max-width: 40rem; padding: 12px 16px;
      border-radius: 12px; background: rgba(0, 0, 0, 0.85); color: #f5f6f7; font: 13px/1.5 ui-monospace, Menlo, monospace;
      white-space: pre-wrap; z-index: 20; }
    #status:empty { display: none; }
    /* Panels sit over the canvas; the canvas keeps the pointer elsewhere. */
    #ui-root .layer { pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="bevy"></canvas>
  <div id="ui-root"></div>
  <div id="status">Loading the viewer…</div>
  <script src="emit.js" data-trunk data-no-minify></script>
  <script type="module" src="ui/ui.js"></script>
  <script type="module" src="boot.js" data-trunk data-no-minify></script>
  <link data-trunk rel="rust" href="../../Cargo.toml" data-target-name="bevy3d_animation" data-cargo-no-default-features
        data-cargo-features="web" data-wasm-opt="3" data-bindgen-target="web"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-multivalue --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-sign-ext --enable-simd" />
</body>
</html>
