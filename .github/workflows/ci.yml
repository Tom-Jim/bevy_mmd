name: Cross-Platform Build Test

on:
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            # Keep other platform jobs running when one platform fails.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            # Install the pinned Zig version required by the native build.
            - name: Install Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0

            # Bevy requires system audio and graphics libraries on Linux.
            - name: Install Linux Dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libc++-dev libc++abi-dev
            # Compile the project without launching the application.
            - name: Build and Check
              run: cargo build --release --locked
