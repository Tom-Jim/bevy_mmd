name: Release

on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    name: Bundle for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Panels
        working-directory: src/ui
        run: bun install
      # The CLI finds tauri.conf.json in its working directory.
      - name: Tauri bundle
        working-directory: src/desktop
        run: ../ui/node_modules/.bin/tauri build -- --profile dist
      - uses: softprops/action-gh-release@v2
        with:
          files: target/dist/bundle/**/*
