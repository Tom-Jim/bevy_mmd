name: Release

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的标签（如 v0.1.0）时触发

jobs:
  publish:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bevy_mmd_linux
            asset_name: bevy_mmd_linux.tar.gz
          - os: windows-latest
            artifact_name: bevy_mmd.exe
            asset_name: bevy_mmd_windows.zip
          - os: macos-latest
            artifact_name: bevy_mmd
            asset_name: bevy_mmd_macos.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # 核心编译步骤（记得带上 --release）
      - name: Build
        run: cargo build --release

      # 打包：把二进制文件和 assets 文件夹放一起
      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging
          cp target/release/bevy3Danimation.exe staging/bevy_mmd.exe
          cp -r assets staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}

      - name: Package Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/release/bevy3Danimation staging/${{ matrix.artifact_name }}
          cp -r assets staging/
          tar -czf ${{ matrix.asset_name }} -C staging .

      # 上传到 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}